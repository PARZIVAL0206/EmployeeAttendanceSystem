services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: attendance_system
      MYSQL_USER: attendance_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - attendance_db_data:/var/lib/mysql
      - ./database/attendance_system.sql:/docker-entrypoint-initdb.d/01-attendance-system.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: attendance_system
      DB_USER: attendance_app
      DB_PASS: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:80"

volumes:
  attendance_db_data:
